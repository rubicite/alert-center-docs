site_name: Alert Center — Public Docs
site_description: The governed notification engine for Salesforce. Real-time alerts for sales, service, and operations.
site_author: TTW
site_url: https://rubicite.github.io/alert-center-docs/
repo_url: https://github.com/rubicite/alert-center-docs

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.tabs
    - search.suggest
    - search.highlight
    - content.code.copy
  custom_dir: docs/overrides

extra_css:
  - stylesheets/custom.css

nav:
  - Home: index.md
  - Features: features.md
  - Use Cases: usecases.md
  - Roadmap: roadmap.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.extra
  - pymdownx.tabbed
  - pymdownx.details

# Optional: set once the public repo is created
# repo_url: https://github.com/<org_or_user>/<public_docs_repo>
# site_url: https://<org_or_user>.github.io/<public_docs_repo>/
